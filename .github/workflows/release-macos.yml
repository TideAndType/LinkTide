name: Build LinkTide DMG

on:
  push:
    branches:
      - build-dmg-0.1.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build Personal DMG
    runs-on: macos-15-intel
    timeout-minutes: 45

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release version
        run: |
          node -e 'const fs=require("fs");const p=require("./package.json");p.version="0.1.2";fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n")'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build desktop app
        run: pnpm build:desktop

      - name: Verify desktop entry
        run: |
          test -s dist/desktop/main.cjs
          ls -lh dist/desktop/main.cjs

      - name: Build universal DMG
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --universal --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: LinkTide-0.1.2-mac-universal
          path: release/*.dmg
          if-no-files-found: error
