name: Release macOS App

on:
  # A version bump merged to main creates a downloadable macOS release.
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build Personal DMG
    runs-on: macos-15-intel
    timeout-minutes: 45

    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set release version
        id: release_version
        run: |
          node -e 'const fs=require("fs");const p=require("./package.json");const v=process.env.RELEASE_VERSION||p.version;if(!/^\d+\.\d+\.\d+$/.test(v))throw Error("Invalid release version");p.version=v;fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");fs.appendFileSync(process.env.GITHUB_OUTPUT,"version="+v+"\n")'
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build desktop app
        run: pnpm build:desktop

      - name: Verify desktop entry
        run: |
          test -s dist/desktop/main.cjs
          echo "Desktop entry exists:"
          ls -lh dist/desktop/main.cjs

      - name: Build universal DMG
        run: pnpm exec electron-builder --config electron-builder.config.cjs --mac --universal --publish never

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.version }}
          name: LinkTide ${{ steps.release_version.outputs.version }}
          generate_release_notes: true
          files: |
            release/*.dmg
